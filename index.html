<title>Population Detective</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap&subset=vietnamese">
<style>
/* Population Detective — practice + test site for population ecology (9th grade Biology / Marine Bio).
   Layout: question card on the left (main), tools (vocabulary key + calculator) on the right; stacks on phones.
   Colors and fonts match Density Detective and Food Web Detective so the sites feel like one set. */
:root {
  --bg: #eaf2f3; --surface: #ffffff; --ink: #10303b; --muted: #557481; --line: #c6d9de; --chip: #deecef;
  --accent: #0a7584; --accent-ink: #ffffff;
  --cover: #f4a23c; --cover-ink: #2b1700;       /* buoy orange: the unknown / carrying capacity line */
  --prey: #2e8a4a;                               /* green solid line: prey */
  --pred: #b5541c;                               /* rust dashed line: predator */
  --in: #1d7f47; --in-bg: #d4f1df;               /* things that ADD to N (births, immigration) */
  --out: #b8352a; --out-bg: #fbdfda;             /* things that SUBTRACT from N (deaths, emigration) */
  --grid: #dbe7ea; --graph-bg: #f7fbfb;
  --good: #1d7f47; --good-bg: #d4f1df; --bad: #b8352a; --bad-bg: #fbdfda;
  --font-body: "Lexend", "Segoe UI", system-ui, sans-serif;
  --font-num: "JetBrains Mono", ui-monospace, "Consolas", monospace;
  --radius: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b1b21; --surface: #11262e; --ink: #e2eff2; --muted: #8fb0ba; --line: #24434d; --chip: #19343d;
    --accent: #3ec1d0; --accent-ink: #04232a; --cover: #f2a33a; --cover-ink: #2b1700;
    --prey: #5fd07f; --pred: #ff9a5c; --in: #5bd894; --in-bg: #123a26; --out: #ff8576; --out-bg: #3f1b17;
    --grid: #1d3740; --graph-bg: #0f2229;
    --good: #5bd894; --good-bg: #123a26; --bad: #ff8576; --bad-bg: #3f1b17; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b1b21; --surface: #11262e; --ink: #e2eff2; --muted: #8fb0ba; --line: #24434d; --chip: #19343d;
  --accent: #3ec1d0; --accent-ink: #04232a; --cover: #f2a33a; --cover-ink: #2b1700;
  --prey: #5fd07f; --pred: #ff9a5c; --in: #5bd894; --in-bg: #123a26; --out: #ff8576; --out-bg: #3f1b17;
  --grid: #1d3740; --graph-bg: #0f2229;
  --good: #5bd894; --good-bg: #123a26; --bad: #ff8576; --bad-bg: #3f1b17; color-scheme: dark;
}

* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.5; }
.wrap {
  max-width: 1240px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 48px;
  display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr) 320px;
  grid-template-areas: "head head" "topics topics" "controls controls" "main side" "foot foot"; align-items: start;
}
.wrap.noside { grid-template-columns: minmax(0, 1fr); grid-template-areas: "head" "topics" "controls" "main" "foot"; }
.wrap.noside .side { display: none; }
header { grid-area: head; }
.title-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.theme-btn { margin-left: auto; }
h1 { font-size: clamp(1.6rem, 3.5vw, 2.2rem); margin: 0; letter-spacing: -0.02em; line-height: 1.15; text-wrap: balance; }
.tagline { margin: 6px 0 0; color: var(--muted); max-width: 70ch; }

/* ---------- Topic buttons ---------- */
.topics { grid-area: topics; display: grid; gap: 8px; grid-template-columns: repeat(6, minmax(0, 1fr)); }
@media (max-width: 1100px) { .topics { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.topic { border: 2px solid var(--line); background: var(--surface); color: var(--ink); font: inherit; font-weight: 500;
  border-radius: var(--radius); padding: 10px 12px; cursor: pointer; text-align: left; display: flex; flex-direction: column; gap: 2px; min-height: 64px; }
.topic small { color: var(--muted); font-weight: 400; font-size: 0.8rem; line-height: 1.3; }
.topic[aria-pressed="true"] { border-color: var(--accent); background: var(--accent); color: var(--accent-ink); }
.topic[aria-pressed="true"] small { color: var(--accent-ink); opacity: 0.85; }

/* ---------- Control bar ---------- */
.controls { grid-area: controls; display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: end;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; }
.ctrl { display: flex; flex-direction: column; gap: 4px; }
.ctrl-label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 500; }
.seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; background: var(--bg); }
.seg button { border: 0; background: transparent; color: var(--ink); font: inherit; font-size: 0.92rem; padding: 7px 14px; cursor: pointer; min-height: 38px; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 500; }
.seg button:disabled { opacity: 0.45; cursor: not-allowed; }
.btn { border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); font: inherit; font-weight: 500;
  padding: 8px 16px; border-radius: 999px; cursor: pointer; min-height: 40px; }
.btn.ghost { background: transparent; color: var(--accent); }
.btn.small { min-height: 34px; padding: 5px 12px; font-size: 0.88rem; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.tools { display: flex; gap: 8px; flex-wrap: wrap; margin-left: auto; }
button:focus-visible, input:focus-visible, [tabindex]:focus-visible { outline: 3px solid var(--cover); outline-offset: 2px; }

/* ---------- Main column ---------- */
main { grid-area: main; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.banner { background: var(--chip); border-radius: var(--radius); padding: 10px 14px; font-weight: 500; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.banner.win { background: var(--good-bg); color: var(--good); }
.card { background: var(--surface); border: 2px solid var(--line); border-radius: var(--radius); padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card.solved { border-color: var(--good); }
.card.flash { animation: flash 0.6s; }
@keyframes flash { 0%, 100% { border-color: var(--line); } 30%, 70% { border-color: var(--bad); background: var(--bad-bg); } }
.qtag { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 500; display: flex; gap: 8px; flex-wrap: wrap; }
.qtag span { background: var(--chip); border-radius: 999px; padding: 2px 10px; }
.prompt { margin: 0; font-size: 1.25rem; line-height: 1.35; text-wrap: balance; }
.story { margin: 0; max-width: 65ch; }
.sub { margin: 0; color: var(--muted); max-width: 65ch; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }

/* BIDE diagram: things coming IN on the left, the population in the middle, things going OUT on the right */
.bide { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: center; }
.bide .col { display: flex; flex-direction: column; gap: 8px; }
.flow { border-radius: 10px; padding: 8px 10px; display: flex; align-items: center; gap: 8px; font-weight: 500; }
.flow .letter { font-family: var(--font-num); font-weight: 700; font-size: 1.15rem; width: 1.6em; text-align: center; }
.flow .val { margin-left: auto; font-family: var(--font-num); font-weight: 700; font-size: 1.1rem; }
.flow.in { background: var(--in-bg); color: var(--in); }
.flow.out { background: var(--out-bg); color: var(--out); }
.flow .what { font-size: 0.85rem; line-height: 1.2; }
.flow.unknown .val { background: var(--cover); color: var(--cover-ink); border-radius: 6px; padding: 0 8px; }
.popbox { border: 2px solid var(--accent); border-radius: 14px; padding: 10px 14px; text-align: center; min-width: 130px; }
.popbox .emoji { font-size: 2rem; line-height: 1.1; }
.popbox .lab { font-size: 0.78rem; color: var(--muted); }
.popbox .val { font-family: var(--font-num); font-weight: 700; font-size: 1.2rem; }
.arrow { color: var(--muted); font-size: 1.4rem; }
.formula { background: var(--chip); border-radius: 10px; padding: 8px 12px; font-family: var(--font-num); font-size: 0.95rem; overflow-x: auto; }
.formula .p { color: var(--in); font-weight: 700; } .formula .m { color: var(--out); font-weight: 700; }
table.data { border-collapse: collapse; font-size: 0.95rem; }
table.data th, table.data td { border: 1px solid var(--line); padding: 6px 12px; text-align: left; }
table.data td { font-family: var(--font-num); text-align: right; }
@media (max-width: 620px) {
  .bide { grid-template-columns: 1fr; }
  .bide .arrow { transform: rotate(90deg); justify-self: center; }
  .popbox { justify-self: center; }
}

/* Graphs */
.graph-wrap { background: var(--graph-bg); border: 1px solid var(--line); border-radius: 10px; padding: 6px; min-width: 0; }
.graph-wrap > svg { display: block; width: 100%; height: auto; touch-action: manipulation; }
.graph-wrap.tappable > svg { cursor: crosshair; }
.graph-note { font-size: 0.8rem; color: var(--muted); margin: 4px 6px 0; }
svg text { font-family: var(--font-body); }
.legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 0.9rem; margin: 2px 6px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend svg { flex-shrink: 0; }

/* Answers */
.answer-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.answer-row label { font-weight: 500; }
input.numin { font: inherit; font-family: var(--font-num); font-size: 1.15rem; width: 9em; padding: 7px 10px; border: 2px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink); }
.choices { display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); }
.choice { border: 2px solid var(--line); background: var(--bg); color: var(--ink); font: inherit; text-align: left; padding: 10px 12px; border-radius: 10px; cursor: pointer; min-height: 48px; }
.choice:hover:not(:disabled) { border-color: var(--accent); }
.choice.right { border-color: var(--good); background: var(--good-bg); color: var(--good); font-weight: 500; }
.choice.wrong { border-color: var(--bad); background: var(--bad-bg); color: var(--bad); text-decoration: line-through; }
.choice:disabled { cursor: default; }
.choice b { display: block; }
.choice small { color: var(--muted); }
.feedback { border-radius: 10px; padding: 8px 12px; font-weight: 500; }
.feedback.good { background: var(--good-bg); color: var(--good); }
.feedback.bad { background: var(--bad-bg); color: var(--bad); }
.feedback.info { background: var(--chip); }
.expl { border-top: 1px dashed var(--line); padding-top: 10px; display: flex; flex-direction: column; gap: 6px; }
.expl h3 { margin: 0; font-size: 1rem; }
.expl ol, .expl ul { margin: 0; padding-left: 1.3em; display: flex; flex-direction: column; gap: 4px; }
.next-row { display: flex; gap: 10px; flex-wrap: wrap; }

/* Limiting factor card */
.lf-card { border: 2px dashed var(--accent); border-radius: 14px; padding: 14px 16px; display: flex; gap: 14px; align-items: flex-start; background: var(--bg); }
.lf-card .emoji { font-size: 2.4rem; line-height: 1; }
.lf-card h3 { margin: 0 0 4px; font-size: 1.15rem; }
.lf-card p { margin: 0; }
.lf-hint { display: flex; flex-wrap: wrap; gap: 4px 18px; font-size: 0.9rem; color: var(--muted); margin-top: -6px; }
.gauge { display: flex; flex-direction: column; gap: 4px; }

/* Simulation */
.sim-field { width: 100%; aspect-ratio: 16 / 7; max-width: 100%; background: var(--graph-bg); border: 1px solid var(--line); border-radius: 10px; display: block; }
.sim-controls { display: flex; gap: 10px 18px; flex-wrap: wrap; align-items: end; }
.sim-controls input[type="range"] { width: 160px; accent-color: var(--accent); }
.caption { background: var(--chip); border-radius: 10px; padding: 10px 12px; font-weight: 500; min-height: 3em; }
.counts { display: flex; gap: 16px; flex-wrap: wrap; font-family: var(--font-num); font-weight: 700; }

/* ---------- Side column ---------- */
.side { grid-area: side; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.panel h2 { margin: 0; font-size: 1rem; }
.panel dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 6px 10px; font-size: 0.9rem; }
.panel dt { font-family: var(--font-num); font-weight: 700; color: var(--accent); }
.panel dd { margin: 0; }
.calc-screen { font-family: var(--font-num); font-size: 1.3rem; text-align: right; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; min-height: 2.2em; overflow-x: auto; white-space: nowrap; }
.calc-keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.calc-keys button { font: inherit; font-family: var(--font-num); font-size: 1.05rem; min-height: 42px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); cursor: pointer; }
.calc-keys button.op { color: var(--accent); font-weight: 700; }
.calc-keys button.eq { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.muted { color: var(--muted); font-size: 0.85rem; margin: 0; }

footer { grid-area: foot; color: var(--muted); font-size: 0.85rem; display: flex; flex-direction: column; gap: 6px; }
footer details summary { cursor: pointer; font-weight: 500; }
footer ul { margin: 6px 0 0; padding-left: 1.2em; }
/* Human population lab */
.lab-step { display: flex; flex-direction: column; gap: 10px; border-top: 1px dashed var(--line); padding-top: 12px; }
.lab-step h3 { margin: 0; font-size: 1.1rem; }
.lab-grid { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 14px; align-items: start; }
.lab-grid .graph-wrap { position: sticky; top: max(8px, env(safe-area-inset-top, 0px)); }   /* graph stays in view while typing */
.lab-table thead th { font-size: 0.8rem; max-width: 7.5em; white-space: normal; line-height: 1.25; vertical-align: bottom; }
@media (max-width: 760px) { .lab-grid { grid-template-columns: minmax(0, 1fr); } .lab-grid .graph-wrap { position: static; } }
.tbl-wrap { overflow-x: auto; }
.lab-table th, .lab-table td { padding: 4px 8px; }
.lab-table input.numin { width: 5.5em; font-size: 1rem; padding: 4px 8px; }
.lab-table tr.ok input { border-color: var(--good); background: var(--good-bg); }
.lab-table tr.bad input { border-color: var(--bad); background: var(--bad-bg); }
.lab-table td.mark { font-family: var(--font-body); font-size: 1.1rem; text-align: center; color: var(--good); font-weight: 700; width: 2em; }
.lab-table tr.bad td.mark { color: var(--bad); }
.lab-item { display: flex; flex-direction: column; gap: 8px; }
.lab-q { margin: 0; font-weight: 500; }
.choices.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.lab-status { margin: 0; font-weight: 500; }
#confetti { position: fixed; inset: 0; pointer-events: none; z-index: 50; width: 100%; height: 100%; }

@media (max-width: 900px) {
  .wrap { grid-template-columns: minmax(0, 1fr); grid-template-areas: "head" "topics" "controls" "main" "side" "foot"; }
  .topics { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
}
@media (prefers-reduced-motion: reduce) { .card.flash { animation: none; border-color: var(--bad); } }
</style>

<canvas id="confetti" hidden></canvas>
<div class="wrap" id="wrap">
  <header>
    <div class="title-row">
      <h1 id="t-title">Population Detective</h1>
      <button class="btn ghost small theme-btn" id="theme-btn" type="button"></button>
    </div>
    <p class="tagline" id="t-tagline"></p>
  </header>

  <nav class="topics" id="topics" aria-label="Topics"></nav>

  <div class="controls" id="controls">
    <div class="ctrl"><span class="ctrl-label" id="t-mode"></span>
      <div class="seg" id="seg-mode"><button type="button" data-mode="practice" id="m-practice"></button><button type="button" data-mode="test" id="m-test"></button></div></div>
    <div class="ctrl"><span class="ctrl-label" id="t-level"></span>
      <div class="seg" id="seg-level"><button type="button" data-level="easy" id="l-easy"></button><button type="button" data-level="medium" id="l-medium"></button><button type="button" data-level="hard" id="l-hard"></button></div></div>
    <div class="ctrl"><span class="ctrl-label" id="t-lang"></span>
      <div class="seg" id="seg-lang"><button type="button" data-lang="en" lang="en">English</button><button type="button" data-lang="es" lang="es">Español</button><button type="button" data-lang="vi" lang="vi">Tiếng Việt</button></div></div>
    <div class="tools">
      <button class="btn ghost small" type="button" id="btn-read"></button>
      <button class="btn ghost small" type="button" id="btn-key" aria-pressed="true"></button>
      <button class="btn ghost small" type="button" id="btn-calc" aria-pressed="true"></button>
      <button class="btn small" type="button" id="btn-new"></button>
    </div>
  </div>

  <main id="main" aria-live="polite"></main>

  <aside class="side" id="side">
    <section class="panel" id="key-panel"></section>
    <section class="panel" id="calc-panel">
      <h2 id="t-calc"></h2>
      <div class="calc-screen" id="calc-screen" aria-live="polite">0</div>
      <div class="calc-keys" id="calc-keys"></div>
      <button class="btn small" type="button" id="calc-use"></button>
      <p class="muted" id="t-usetip"></p>
    </section>
  </aside>

  <footer id="foot"></footer>
</div>
<script>

function parseNum(str) {
  let s = String(str).trim().replace(/[−–]/g, "-").replace(/\s/g, "");

const G = { W: 640, H: 370, l: 74, r: 40, t: 16, b: 60 };
function niceStep(range, n) {
  const raw = range / (n || 5), p = 10 ** Math.floor(Math.log10(raw)), f = raw / p;
  return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p;
}
const niceCeil = (v, n) => { const s = niceStep(v, n || 5); return Math.ceil(v / s) * s; };
// Linear interpolation on a sampled series [[x, y], ...]
function valAt(pts, x) {
  if (x <= pts[0][0]) return pts[0][1];
  for (let i = 1; i < pts.length; i++) if (pts[i][0] >= x) {
    const [x0, y0] = pts[i - 1], [x1, y1] = pts[i];
    return y0 + (y1 - y0) * (x - x0) / (x1 - x0);
  }
  return pts[pts.length - 1][1];
}
function sample(f, x0, x1, step) { const out = []; for (let x = x0; x <= x1 + 1e-9; x += step) out.push([x, f(x)]); return out; }
// Turn a true/false test along x into ranges [[a, b], ...]
function rangesWhere(pts, test) {
  const out = []; let start = null;
  pts.forEach(([x], i) => { const ok = test(i); if (ok && start === null) start = x; if (!ok && start !== null) { out.push([start, pts[i - 1][0]]); start = null; } });
  if (start !== null) out.push([start, pts[pts.length - 1][0]]);
  return out;
}

function drawGraph(spec, q) {

  q._scale = { xMin, xMax, yMax, pw, ph };

  s += `<rect x="${G.l}" y="${G.t}" width="${pw}" height="${ph}" fill="var(--surface)" stroke="none"/>`;
  // shaded answer areas (only after the question is done)
  (spec.shade || []).forEach(([a, b]) => {
    const x0 = X(Math.max(a, xMin)), x1 = X(Math.min(b, xMax));
    s += `<rect x="${x0}" y="${G.t}" width="${Math.max(4, x1 - x0)}" height="${ph}" fill="var(--cover)" opacity="0.28"/>`;
  });
  if (spec.shadeY) { const [a, b] = spec.shadeY; s += `<rect x="${G.l}" y="${Y(b)}" width="${pw}" height="${Y(a) - Y(b)}" fill="var(--cover)" opacity="0.28"/>`; }
  // grid + ticks
  const ys = niceStep(yMax, 5);
  for (let v = 0; v <= yMax + 1e-9; v += ys) {
    s += `<line x1="${G.l}" x2="${G.l + pw}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--grid)" stroke-width="1"/>`;
    s += `<text x="${G.l - 8}" y="${Y(v) + 4}" text-anchor="end" font-size="15" fill="var(--muted)">${fmt(v)}</text>`;
  }
  const xs = spec.xStep || niceStep(xMax - xMin, 6);
  for (let v = Math.ceil(xMin / xs) * xs; v <= xMax + 1e-9; v += xs) {
    s += `<line x1="${X(v)}" x2="${X(v)}" y1="${G.t}" y2="${G.t + ph}" stroke="var(--grid)" stroke-width="1"/>`;
    s += `<text x="${X(v)}" y="${G.t + ph + 20}" text-anchor="middle" font-size="15" fill="var(--muted)">${spec.xMin ? v : fmt(v)}</text>`;
  }
  s += `<line x1="${G.l}" x2="${G.l}" y1="${G.t}" y2="${G.t + ph}" stroke="var(--ink)" stroke-width="1.5"/>`;
  s += `<line x1="${G.l}" x2="${G.l + pw}" y1="${G.t + ph}" y2="${G.t + ph}" stroke="var(--ink)" stroke-width="1.5"/>`;
  s += `<text x="${G.l + pw / 2}" y="${G.H - 8}" text-anchor="middle" font-size="16" fill="var(--ink)" font-weight="500">${esc(spec.xLabel)}</text>`;
  s += `<text transform="translate(16 ${G.t + ph / 2}) rotate(-90)" text-anchor="middle" font-size="16" fill="var(--ink)" font-weight="500">${esc(spec.yLabel)}</text>`;
  // event line (carrying capacity changed)
  if (spec.event) {
    s += `<line x1="${X(spec.event.x)}" x2="${X(spec.event.x)}" y1="${G.t}" y2="${G.t + ph}" stroke="var(--muted)" stroke-width="2" stroke-dasharray="3 5"/>`;
    s += `<text x="${X(spec.event.x) + 6}" y="${G.t + 16}" font-size="13" fill="var(--muted)">${esc(spec.event.label)}</text>`;
  }
  // K line
  if (spec.kLine) {
    s += `<line x1="${G.l}" x2="${G.l + pw}" y1="${Y(spec.kLine.y)}" y2="${Y(spec.kLine.y)}" stroke="var(--cover)" stroke-width="2.5" stroke-dasharray="9 6"/>`;
    s += `<text x="${G.l + pw + 8}" y="${Y(spec.kLine.y) + 5}" font-size="17" font-weight="700" fill="var(--cover)">${esc(spec.kLine.label)}</text>`;
  }
  // data lines; labels at the right end (nudged apart if they would overlap)
  const ends = [];
  (spec.series || []).forEach((sr) => {
    const pts = sr.pts.filter(([x]) => x >= xMin && x <= xMax);
    let d = "", clipped = false, last = null;
    for (const [x, y] of pts) { if (clipped) break; if (y > yMax) clipped = true; const p = [X(x), Y(y)]; d += (d ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1); last = p; }
    s += `<path d="${d}" fill="none" stroke="var(${sr.color})" stroke-width="${sr.width || 3.5}" stroke-linejoin="round" stroke-linecap="round" ${sr.dash ? `stroke-dasharray="${sr.dash}"` : ""}/>`;
    if (sr.dots) pts.forEach(([x, y]) => { s += `<circle cx="${X(x)}" cy="${Y(y)}" r="5" fill="var(${sr.color})" stroke="var(--surface)" stroke-width="2"/>`; });
    if (sr.label && last) ends.push({ x: last[0], y: last[1], label: sr.label, color: sr.color });
  });
  ends.sort((a, b) => a.y - b.y);
  for (let i = 1; i < ends.length; i++) if (ends[i].y - ends[i - 1].y < 18) ends[i].y = ends[i - 1].y + 18;
  ends.forEach((e) => { s += `<text x="${Math.min(e.x + 8, G.W - 4)}" y="${e.y + 5}" font-size="16" font-weight="700" fill="var(${e.color})">${esc(e.label)}</text>`; });
  // student's marker
  if (q && q.tap) {
    const mx = X(q.tap.x), my = Y(q.tap.y);
    s += `<g stroke-linecap="round"><circle cx="${mx}" cy="${my}" r="13" fill="var(--surface)" opacity="0.8"/>`;
    s += `<path d="M${mx - 8} ${my - 8}L${mx + 8} ${my + 8}M${mx + 8} ${my - 8}L${mx - 8} ${my + 8}" stroke="var(--ink)" stroke-width="4"/></g>`;
  }
  if (spec.tap) s += `<rect id="graph-hit" x="${G.l}" y="${G.t}" width="${pw}" height="${ph}" fill="transparent"/>`;
  return s + "</svg>";
}

// Convert a tap/click on the SVG into graph values (x = time, y = population)
function graphPoint(evt, svg, q) {
  const pt = svg.createSVGPoint(); pt.x = evt.clientX; pt.y = evt.clientY;
  const p = pt.matrixTransform(svg.getScreenCTM().inverse());
  const sc = q._scale;
  const fx = Math.min(1, Math.max(0, (p.x - G.l) / sc.pw)), fy = Math.min(1, Math.max(0, (G.t + sc.ph - p.y) / sc.ph));
  return { x: sc.xMin + fx * (sc.xMax - sc.xMin), y: fy * sc.yMax };
}

// ======================================================================
// POPULATION MODELS
// ======================================================================
function logisticCurve(K, N0, r) { return (t) => K / (1 + ((K - N0) / N0) * Math.exp(-r * t)); }
function makeS() {
  const K = pick([200, 300, 400, 500, 600, 800, 1000, 1200]);
  const N0 = Math.max(2, Math.round(K * rnd(0.02, 0.05)));
  const tInfl = rnd(7, 11), r = Math.log((K - N0) / N0) / tInfl, tMax = 25;
  const f = logisticCurve(K, N0, r);
  return { kind: "S", K, N0, r, tInfl, tMax, f, pts: sample(f, 0, tMax, 0.25), yMax: niceCeil(K * 1.15) };
}
function makeJ() {
  const N0 = ri(5, 20), top = pick([400, 600, 800, 1000, 1500, 2000]), tMax = 25;
  const r = Math.log(top / N0) / tMax, f = (t) => N0 * Math.exp(r * t);
  return { kind: "J", N0, r, top, tMax, f, pts: sample(f, 0, tMax, 0.25), yMax: niceCeil(top * 1.1) };
}
// Lotka–Volterra predator–prey model (prey also has a carrying capacity so it can't grow forever)
const LV = { a: 0.9, b: 0.03, c: 0.7, d: 0.006, K: 1500 };
function lvDeriv(x, y) { return [LV.a * x * (1 - x / LV.K) - LV.b * x * y, LV.d * x * y - LV.c * y]; }
function lvStep(x, y, dt) {
  const k1 = lvDeriv(x, y), k2 = lvDeriv(x + dt / 2 * k1[0], y + dt / 2 * k1[1]);
  const k3 = lvDeriv(x + dt / 2 * k2[0], y + dt / 2 * k2[1]), k4 = lvDeriv(x + dt * k3[0], y + dt * k3[1]);
  return [x + dt / 6 * (k1[0] + 2 * k2[0] + 2 * k3[0] + k4[0]), y + dt / 6 * (k1[1] + 2 * k2[1] + 2 * k3[1] + k4[1])];
}
function makeLV() {
  const xs = LV.c / LV.d, ys = (LV.a / LV.b) * (1 - xs / LV.K);
  let x = xs * rnd(1.5, 2.1), y = ys * rnd(0.45, 0.7);
  const prey = [], pred = [], tMax = 40, dt = 0.02;
  for (let i = 0, t = 0; t <= tMax + 1e-9; i++, t = i * dt) {
    if (i % 10 === 0) { prey.push([+t.toFixed(2), x]); pred.push([+t.toFixed(2), y]); }
    [x, y] = lvStep(x, y, dt);
  }
  const yMax = niceCeil(Math.max(...prey.map((p) => p[1]), ...pred.map((p) => p[1])) * 1.08);
  return { prey, pred, tMax, yMax };
}
function peaksOf(pts) {
  const out = [];
  for (let i = 1; i < pts.length - 1; i++) if (pts[i][1] > pts[i - 1][1] && pts[i][1] >= pts[i + 1][1]) out.push(pts[i][0]);
  return out;
}

// ======================================================================
// QUESTION GENERATORS
// Each returns a question object q:
//   kind: "num" | "choice" | "tap"
//   view(): { prompt, story, sub, subHint, visual }   (built in the current language)
//   choices(): [{ id, label, desc }]                   (choice questions)
//   correct: answer number or choice id
//   check(value): { ok, hint }
//   explain(): array of lines (HTML)
//   graph(): graph spec (graph questions)
// ======================================================================
function choiceCheck(hintKey, hintP) { return function (v) { return { ok: v === this.correct, hint: T(hintKey, hintP ? hintP() : undefined) }; }; }

// ---------- BIDE ----------
function genBide() {
  const h = habitat(), org = pickOrg(h), lv = levelNum();
  let B, I, D, E, type;
  type = lv === 1 ? (Math.random() < 0.55 ? "change" : "trend") : lv === 2 ? "new" : "missing";
  const stable = type === "trend" && Math.random() < 0.34;
  for (;;) {
    B = ri(10, 90); I = ri(0, 40); D = ri(10, 90); E = ri(0, 40);
    if (stable) { E = B + I - D; if (E < 0 || E > 50) continue; }
    if (B + I - D - E !== 0 || stable) break;
  }
  const IN = B + I, OUT = D + E, dn = IN - OUT;
  let n0 = ri(80, 600); if (n0 + dn < 10) n0 += 100;
  const n1 = n0 + dn;
  const unk = type === "missing" ? pick(["B", "I", "D", "E"]) : null;
  const vals = { B, I, D, E };
  // Test mode mixes up the order of B, I, D, E (in the story and the table) so students must read
  // each label instead of memorizing "first two add, last two subtract". Saved here so it stays put.
  const order = shuffle(["B", "I", "D", "E"]);
  const q = { topic: "bide", type, kind: type === "trend" ? "choice" : "num", h, org, vals, IN, OUT, dn, n0, n1, unk, order };
  q.correct = type === "change" ? dn : type === "new" ? n1 : type === "missing" ? vals[unk] : (dn > 0 ? "grow" : dn < 0 ? "shrink" : "stable");

  q.view = () => {
    const o = orgName(org), place = L().place[h], ph = L().ph;
    const show = (k) => (k === unk ? T("some") : fmt(vals[k]));
    let story = type === "change" || type === "trend" ? T("bYear", { place }) + " " : T("bStart", { place, n: fmt(n0), o }) + " ";
    if (state.mode === "test") story += order.map((k) => ph[k](show(k))).join(". ") + ".";
    else story += T("bDuring", { B: ph.B(show("B")), I: ph.I(show("I")), D: ph.D(show("D")), E: ph.E(show("E")) });
    if (type === "missing") story += " " + T("bEnd", { n: fmt(n1), o });
    story = capSentences(story);
    const prompt = type === "change" ? T("qChange", { o }) : type === "trend" ? T("qTrend", { o })
      : type === "new" ? T("qNew", { o }) : T("qMissing", { o, what: L().what[unk] });
    const sub = type === "change" ? T("subChange") : type === "new" ? T("subNew") : type === "missing" ? T("subMissing") : "";
    return { prompt, story, sub, subHint: type !== "change", visual: bideVisual(q) };
  };
  q.choices = () => [
    { id: "grow", label: T("growing"), desc: T("growingD") },
    { id: "shrink", label: T("shrinking"), desc: T("shrinkingD") },
    { id: "stable", label: T("stable"), desc: T("stableD") },
  ];
  q.check = function (v) {
    if (type === "trend") return { ok: v === q.correct, hint: T("hintTrend") };
    if (v === q.correct) return { ok: true };
    let hint = T("hintGeneric");
    if (type === "change") {
      if (v === B - D && I + E > 0) hint = T("hintIE");
      else if (v === IN + OUT) hint = T("hintSigns");
      else if (v === -dn) hint = T("hintSignFlip");
    } else if (type === "new") {
      if (v === dn) hint = T("hintGaveChange");
      else if (v === n0 - dn) hint = T("hintSignFlip");
      else if (v === n0 + B - D && I + E > 0) hint = T("hintIE");
      else if (v === n0 + IN + OUT) hint = T("hintSigns");
    } else hint = T("hintMissing");
    return { ok: false, hint };
  };
  q.explain = () => {
    const [inW, outW] = INOUT[state.lang];
    const lines = [];
    if (type !== "missing") {
      lines.push(T("eIn", { b: fmt(B), i: fmt(I), x: fmt(IN) }), T("eOut", { d: fmt(D), e: fmt(E), x: fmt(OUT) }), T("eDn", { a: fmt(IN), b: fmt(OUT), x: fmt(dn) }));
      if (type === "new") lines.push(T("eNew", { a: fmt(n0), b: paren(dn), x: fmt(n1) }));
      else lines.push(dn > 0 ? T("eGrow") : dn < 0 ? T("eShrink") : T("eStable"));
    } else {
      lines.push(T("eDnEnds", { a: fmt(n1), b: fmt(n0), x: fmt(dn) }));
      if (unk === "B" || unk === "I") {
        const other = unk === "B" ? "I" : "B";
        lines.push(T("eOut", { d: fmt(D), e: fmt(E), x: fmt(OUT) }));
        lines.push(T("eNeedIn", { a: paren(dn), b: fmt(OUT), x: fmt(IN) }));
        lines.push(T("eSolve", { L: unk, T: inW, L2: other, a: fmt(IN), b: fmt(vals[other]), x: fmt(vals[unk]) }));
      } else {
        const other = unk === "D" ? "E" : "D";
        lines.push(T("eIn", { b: fmt(B), i: fmt(I), x: fmt(IN) }));
        lines.push(T("eNeedOut", { a: fmt(IN), b: paren(dn), x: fmt(OUT) }));
        lines.push(T("eSolve", { L: unk, T: outW, L2: other, a: fmt(OUT), b: fmt(vals[other]), x: fmt(vals[unk]) }));
      }
    }
    return lines.map((l) => `<span class="num">${esc(l)}</span>`);
  };
  return q;
}

function bideVisual(q) {
  const { vals, unk, type } = q;
  const showVal = (k) => (k === unk ? "?" : fmt(vals[k]));
  if (state.mode === "test") {
    // Test: plain data table (no arrows or formula)
    let rows = "";
    if (type === "new" || type === "missing") rows += `<tr><th>${T("startN")}</th><td>${fmt(q.n0)}</td></tr>`;
    const label = { B: "births", I: "imm", D: "deaths", E: "emi" };
    q.order.forEach((k) => { rows += `<tr><th>${T(label[k])}</th><td>${showVal(k)}</td></tr>`; });
    if (type === "missing") rows += `<tr><th>${T("endN")}</th><td>${fmt(q.n1)}</td></tr>`;
    return `<div style="overflow-x:auto"><table class="data">${rows}</table></div>`;
  }
  const flow = (k, dir) => `<div class="flow ${dir}${k === unk ? " unknown" : ""}"><span class="letter">${k}</span><span class="what">${esc((dir === "in" ? L().bideIn : L().bideOut)[k])}</span><span class="val">${showVal(k)}</span></div>`;
  let pop = `<div class="emoji" aria-hidden="true">${ORG[q.org].em}</div>`;
  if (type === "new" || type === "missing") pop += `<div class="lab">${T("startN")}</div><div class="val">${fmt(q.n0)}</div>`;
  if (type === "new") pop += `<div class="lab">${T("endN")}</div><div class="val" style="color:var(--cover)">?</div>`;
  if (type === "missing") pop += `<div class="lab">${T("endN")}</div><div class="val">${fmt(q.n1)}</div>`;
  if (type === "change" || type === "trend") pop += `<div class="lab">N</div>`;
  return `<div class="bide">
      <div class="col"><span class="ctrl-label">${T("addsN")}</span>${flow("B", "in")}${flow("I", "in")}</div>
      <div class="col" style="align-items:center"><div class="popbox">${pop}</div></div>
      <div class="col"><span class="ctrl-label">${T("subsN")}</span>${flow("D", "out")}${flow("E", "out")}</div>
    </div>
    <div class="formula">ΔN = (<span class="p">B</span> + <span class="p">I</span>) − (<span class="m">D</span> + <span class="m">E</span>)${type === "new" || type === "missing" ? " &nbsp;·&nbsp; N<sub>end</sub> = N<sub>start</sub> + ΔN" : ""}</div>`;
}

// ---------- J and S curves ----------
function curveSpec(c, extra) {
  return Object.assign({ xMax: c.tMax, yMax: c.yMax, xLabel: T("time"), yLabel: T("popSize"), xStep: 5,
    series: [{ pts: c.pts, color: "--accent" }] }, extra || {});
}
function genCurves() {
  const lv = levelNum(), h = habitat(), org = pickOrg(h);
  const type = pick(lv === 1 ? ["shape", "growth"] : lv === 2 ? ["tapFast", "tapLevel", "tapLag", "res"] : ["two", "why", "predictJ", "scen", "tapFast"]);
  let c = type === "tapLevel" || type === "why" ? makeS() : type === "predictJ" ? makeJ() : Math.random() < 0.5 ? makeJ() : makeS();
  const q = { topic: "curves", type, h, org, c, kind: "choice" };
  const tagNote = () => `${ORG[org].em} ${orgName(org)}`;
  const basicView = (promptKey, subKey) => () => ({ prompt: T(promptKey), story: tagNote(), sub: subKey ? T(subKey) : "", subHint: true });

  if (type === "shape" || type === "growth" || type === "res") {
    q.correct = type === "shape" ? c.kind : type === "growth" ? (c.kind === "J" ? "expo" : "logi") : (c.kind === "J" ? "resU" : "resL");
    q.view = basicView(type === "shape" ? "qShape" : type === "growth" ? "qGrowth" : "qRes");
    q.choices = () => type === "shape" ? [{ id: "J", label: T("J"), desc: T("Jd") }, { id: "S", label: T("S"), desc: T("Sd") }]
      : type === "growth" ? [{ id: "expo", label: T("expo"), desc: T("J") }, { id: "logi", label: T("logi"), desc: T("S") }]
      : q._order.map((id) => ({ id, label: T(id) }));
    q._order = shuffle(["resU", "resL", "resN", "resA"]);
    q.check = choiceCheck(type === "res" ? "hintRes" : "hintShape");
    q.graph = () => curveSpec(c);
    q.explain = () => [esc(c.kind === "J" ? T("eJ") : T("eS"))];
  } else if (type === "tapFast" || type === "tapLevel" || type === "tapLag") {
    q.kind = "tap";
    let ranges;
    if (c.kind === "S") {
      const off = (p) => c.tInfl + Math.log(p / (1 - p)) / c.r;
      ranges = type === "tapFast" ? [[off(0.25), off(0.75)]] : type === "tapLevel" ? [[off(0.93), c.tMax]] : [[0, off(0.1)]];
    } else {
      ranges = type === "tapFast" ? [[c.tMax * 0.72, c.tMax]] : [[0, c.tMax + Math.log(0.1) / c.r]];
    }
    q.ranges = ranges;
    const key = { tapFast: "TapFast", tapLevel: "TapLevel", tapLag: "TapLag" }[type];
    q.view = basicView("q" + key, "sub" + key);
    q.check = (p) => {
      const near = Math.abs(p.y - c.f(p.x)) <= 0.12 * c.yMax;
      const inRange = ranges.some(([a, b]) => p.x >= a - 0.4 && p.x <= b + 0.4);
      return { ok: near && inRange, hint: T("hint" + key) };
    };
    q.graph = () => curveSpec(c, { tap: true, shade: q.done ? ranges : null, kLine: q.done && c.kind === "S" && type === "tapLevel" ? { y: c.K, label: "K" } : null });
    q.explain = () => {
      const l = [esc(c.kind === "J" ? T("eJ") : T("eS"))];
      if (type === "tapFast") l.push(esc(c.kind === "S" ? T("eFastS", { h: fmt(c.K / 2) }) : T("eFastJ")));
      if (type === "tapLevel") l.push(esc(T("eLevel", { k: fmt(c.K) })));
      if (type === "tapLag") l.push(esc(T("eLag")));
      l.push(esc(T("shaded")));
      return l;
    };
  } else if (type === "two") {
    const s = makeS();
    const j = { pts: sample((t) => s.N0 * Math.exp(s.r * t), 0, s.tMax, 0.25) };
    const sIsA = Math.random() < 0.5;
    q.correct = sIsA ? "A" : "B";
    q.view = () => ({ prompt: T("qTwo"), story: tagNote(), sub: "" });
    q.choices = () => [{ id: "A", label: T("lineA") }, { id: "B", label: T("lineB") }];
    q.check = choiceCheck("hintTwo");
    const yMax = niceCeil(s.K * 1.6);
    q.graph = () => ({ xMax: s.tMax, yMax, xLabel: T("time"), yLabel: T("popSize"), xStep: 5, series: [
      { pts: s.pts, color: "--accent", label: sIsA ? "A" : "B" },
      { pts: j.pts, color: "--pred", dash: "10 7", label: sIsA ? "B" : "A" }] });
    q.explain = () => [esc(T("eTwo", { x: q.correct, y: sIsA ? "B" : "A" }))];
  } else {
    // why / predictJ / scen
    const map = { why: ["qWhyLevel", ["wl0", "wl1", "wl2", "wl3"], "hintWhy", "eWhy"], predictJ: ["qPredictJ", ["pj0", "pj1", "pj2"], "hintPJ", "ePJ"], scen: ["qScen", ["sc0", "sc1", "sc2"], "hintScen", "eScen"] }[type];
    q.correct = map[1][0]; q._order = shuffle(map[1]);
    q.view = () => ({ prompt: T(map[0]), story: type === "scen" ? "" : tagNote(), sub: "" });
    q.choices = () => q._order.map((id) => ({ id, label: T(id) }));
    q.check = choiceCheck(map[2]);
    if (type === "predictJ") { const short = c.pts.filter(([t]) => t <= c.tMax * 0.75); q.graph = () => curveSpec(c, { series: [{ pts: short, color: "--accent" }], yMax: niceCeil(c.f(c.tMax * 0.75) * 1.3) }); }
    else if (type === "why") q.graph = () => curveSpec(c, { kLine: { y: c.K, label: "K" } });
    q.explain = () => [esc(T(map[3]))];
  }
  return q;
}

// ---------- Carrying capacity ----------
function genK() {
  const lv = levelNum(), h = habitat(), org = pickOrg(h);
  const type = pick(lv === 1 ? ["tapK", "defK", "readK"] : lv === 2 ? ["tapAbove", "tapK2", "predict"] : ["changeK", "shift", "reindeer", "changeK"]);
  const q = { topic: "k", type, h, org, kind: "choice" };
  const tagNote = () => `${ORG[org].em} ${orgName(org)}`;

  if (type === "tapK" || type === "readK" || type === "defK") {
    const c = makeS(); q.c = c;
    if (type === "tapK") {
      q.kind = "tap";
      q.view = () => ({ prompt: T("qTapK"), story: tagNote(), sub: T("subTapK"), subHint: true });
      const tol = 0.07 * c.yMax;
      q.check = (p) => ({ ok: Math.abs(p.y - c.K) <= tol, hint: T("hintTapK") });
      q.graph = () => curveSpec(c, { tap: true, kLine: q.done ? { y: c.K, label: "K" } : null, shadeY: q.done ? [c.K - tol, c.K + tol] : null });
      q.explain = () => [esc(T("eK", { k: fmt(c.K) }))];
    } else if (type === "readK") {
      const opts = [c.K, c.K / 2, c.yMax, Math.round(c.K / 4)].filter((v, i, a) => a.indexOf(v) === i);
      q.correct = String(c.K); q._order = shuffle(opts.map(String));
      q.view = () => ({ prompt: T("qReadK"), story: tagNote(), sub: "" });
      q.choices = () => q._order.map((id) => ({ id, label: fmt(Number(id)) }));
      q.check = choiceCheck("hintReadK");
      q.graph = () => curveSpec(c, { kLine: q.done ? { y: c.K, label: "K" } : null });
      q.explain = () => [esc(T("eK", { k: fmt(c.K) }))];
    } else {
      q.correct = "dk0"; q._order = shuffle(["dk0", "dk1", "dk2", "dk3"]);
      q.view = () => ({ prompt: T("qDefK"), story: "", sub: "" });
      q.choices = () => q._order.map((id) => ({ id, label: T(id) }));
      q.check = choiceCheck("hintDefK");
      q.graph = () => curveSpec(c, { kLine: { y: c.K, label: "K" } });
      q.explain = () => [esc(T("dk0")), esc(T("eS"))];
    }
  } else if (type === "tapAbove" || type === "tapK2") {
    // Overshoot and dieback: a time-delayed logistic model. The population reacts to crowding a few
    // years late (food runs out after it has already grown), so it swings above and below K, then settles.
    const K = pick([200, 300, 400, 500, 600, 800, 1000]), r = rnd(0.45, 0.55), tau = rnd(1.05, 1.2) / r, tMax = 40, dt = 0.01;
    const hist = [], lag = Math.round(tau / dt); let N = K * 0.03;
    for (let i = 0; i <= tMax / dt; i++) { hist.push(N); const Nlag = i >= lag ? hist[i - lag] : K * 0.03; N += dt * r * N * (1 - Nlag / K); }
    const f = (t) => hist[Math.min(hist.length - 1, Math.round(t / dt))];
    const pts = sample(f, 0, tMax, 0.2), yMax = niceCeil(Math.max(...hist) * 1.1);
    q.K = K;
    q.kind = "tap";
    if (type === "tapAbove") {
      const ranges = rangesWhere(pts, (i) => pts[i][1] > K * 1.02);
      q.view = () => ({ prompt: T("qTapAbove"), story: tagNote(), sub: T("subTapAbove") });
      q.check = (p) => ({ ok: f(p.x) > K * 1.02 && p.y > K && Math.abs(p.y - f(p.x)) <= 0.14 * yMax, hint: T("hintTapAbove") });
      q.graph = () => ({ xMax: tMax, yMax, xStep: 5, xLabel: T("time"), yLabel: T("popSize"), tap: true, series: [{ pts, color: "--accent" }], kLine: { y: K, label: "K" }, shade: q.done ? ranges : null });
      q.explain = () => [esc(T("eAbove")), esc(T("shaded"))];
    } else {
      const tol = 0.07 * yMax;
      q.view = () => ({ prompt: T("qTapK2"), story: tagNote(), sub: T("subTapK2"), subHint: true });
      q.check = (p) => ({ ok: Math.abs(p.y - K) <= tol, hint: T("hintTapK2") });
      q.graph = () => ({ xMax: tMax, yMax, xStep: 5, xLabel: T("time"), yLabel: T("popSize"), tap: true, series: [{ pts, color: "--accent" }], kLine: q.done ? { y: K, label: "K" } : null, shadeY: q.done ? [K - tol, K + tol] : null });
      q.explain = () => [esc(T("eK", { k: fmt(K) })), esc(T("eAbove"))];
    }
  } else if (type === "predict") {
    const K = pick([200, 300, 400, 500, 600, 800]);
    const kind = pick(["grow", "shrink", "same"]);
    const n = kind === "same" ? K : kind === "grow" ? Math.round(K * rnd(0.3, 0.75) / 10) * 10 : Math.round(K * rnd(1.2, 1.5) / 10) * 10;
    q.correct = kind; q.n = n; q.K = K;
    q.view = () => ({ prompt: T("qPredict", { n: fmt(n), k: fmt(K), o: orgName(org) }), story: "", sub: "", visual: gauge(n, K) });
    q.choices = () => [{ id: "grow", label: T("pGrow") }, { id: "shrink", label: T("pShrink") }, { id: "same", label: T("pSame") }];
    q.check = choiceCheck("hintPredict");
    q.explain = () => [esc(T(kind === "grow" ? "eGrowK" : kind === "shrink" ? "eShrinkK" : "eSameK", { n: fmt(n), k: fmt(K) }))];
  } else if (type === "changeK") {
    const sc = pick(K_SCEN[h]); q.sc = sc;
    q.correct = sc.dir;
    q.view = () => ({ prompt: T("qChangeK", { s: L().kScen[sc.id], o: orgName(sc.org) }), story: `${ORG[sc.org].em} ${orgName(sc.org)}`, sub: "" });
    q.choices = () => [{ id: "up", label: T("kUp") }, { id: "down", label: T("kDown") }, { id: "same", label: T("kSame") }];
    q.check = choiceCheck("hintChangeK", () => ({ o: orgName(sc.org) }));
    q.explain = () => [esc(T(sc.dir === "up" ? "eMoreRes" : "eLessRes"))];
  } else if (type === "shift") {
    const base = makeS(), K1 = base.K, up = Math.random() < 0.5;
    const K2 = Math.round((K1 * (up ? rnd(1.4, 1.7) : rnd(0.45, 0.65))) / 10) * 10, te = ri(22, 28), tMax = 45;
    const f = (t) => (t <= te ? base.f(t) : K2 + (base.f(te) - K2) * Math.exp(-0.35 * (t - te)));
    const pts = sample(f, 0, tMax, 0.25), yMax = niceCeil(Math.max(K1, K2) * 1.2);
    q.correct = up ? "up" : "down";
    q.view = () => ({ prompt: T("qShift", { t: te }), story: tagNote(), sub: "" });
    q.choices = () => [{ id: "up", label: T("kUp") }, { id: "down", label: T("kDown") }, { id: "same", label: T("kSame") }];
    q.check = choiceCheck("hintShift", () => ({ t: te }));
    q.graph = () => ({ xMax: tMax, yMax, xStep: 5, xLabel: T("time"), yLabel: T("popSize"), series: [{ pts, color: "--accent" }], event: { x: te, label: T("event") } });
    q.explain = () => [esc(T(up ? "eShiftUp" : "eShiftDown", { t: te, k1: fmt(K1), k2: fmt(K2) }))];
  } else {
    // St. Matthew Island reindeer — real counts (Klein 1968)
    q.correct = "rd0"; q._order = shuffle(["rd0", "rd1", "rd2", "rd3"]);
    const pts = [[1944, 29], [1957, 1350], [1963, 6000], [1966, 42]];
    q.view = () => ({ prompt: T("qReindeer"), story: "", sub: "" });
    q.choices = () => q._order.map((id) => ({ id, label: T(id) }));
    q.check = choiceCheck("hintReindeer");
    q.graph = () => ({ xMin: 1940, xMax: 1970, xStep: 5, yMax: 7000, xLabel: T("year"), yLabel: T("reindeerAxis"), series: [{ pts, color: "--accent", dots: true, width: 3 }], note: T("reindeerNote") });
    q.explain = () => [esc(T("eReindeer"))];
  }
  return q;
}
// Small number line: where N is compared with K
function gauge(n, K) {
  const max = Math.max(n, K) * 1.25, W = 560, X = (v) => 20 + (v / max) * (W - 40);
  return `<div class="graph-wrap"><svg viewBox="0 0 ${W} 92" role="img" aria-label="N = ${n}, K = ${K}">
    <line x1="20" x2="${W - 20}" y1="52" y2="52" stroke="var(--line)" stroke-width="10" stroke-linecap="round"/>
    <line x1="20" x2="${X(n)}" y1="52" y2="52" stroke="var(--accent)" stroke-width="10" stroke-linecap="round"/>
    <line x1="${X(K)}" x2="${X(K)}" y1="30" y2="74" stroke="var(--cover)" stroke-width="3" stroke-dasharray="5 4"/>
    <text x="${X(K)}" y="22" text-anchor="middle" font-size="15" font-weight="700" fill="var(--cover)">K = ${fmt(K)}</text>
    <circle cx="${X(n)}" cy="52" r="9" fill="var(--accent)" stroke="var(--surface)" stroke-width="3"/>
    <text x="${X(n)}" y="88" text-anchor="middle" font-size="15" font-weight="700" fill="var(--accent)">N = ${fmt(n)}</text>
  </svg></div>`;
}

// ---------- Predator and prey ----------
function genPP() {
  const lv = levelNum(), h = habitat(), pair = pick(PAIRS[h]);
  const type = pick(lv === 1 ? ["whichPred", "afterUp", "whyDown"] : lv === 2 ? ["tapPreyPeak", "tapPredFall", "unl"] : ["order", "whyLag", "remove", "unl"]);
  const m = makeLV();
  const q = { topic: "pp", type, h, pair, m, kind: "choice" };
  const prey = () => pair.prey[state.lang], pred = () => pair.pred[state.lang];
  const nm = () => ({ prey: prey(), pred: pred() });
  const unlabeled = type === "unl";
  const predIsA = Math.random() < 0.5;
  const spec = (extra) => Object.assign({
    xMax: m.tMax, yMax: m.yMax, xStep: 5, xLabel: T("time"), yLabel: T("popSize"),
    series: unlabeled
      ? [{ pts: predIsA ? m.pred : m.prey, color: "--accent", label: "A" }, { pts: predIsA ? m.prey : m.pred, color: "--cover", dash: "10 7", label: "B" }]
      : [{ pts: m.prey, color: "--prey" }, { pts: m.pred, color: "--pred", dash: "10 7" }],   // named in the legend below
  }, extra || {});
  q.graph = () => spec();
  const legend = () => unlabeled ? "" : `<div class="legend"><span><svg width="34" height="10" aria-hidden="true"><line x1="0" x2="34" y1="5" y2="5" stroke="var(--prey)" stroke-width="4"/></svg>${esc(prey())} (${T("solid")})</span><span><svg width="34" height="10" aria-hidden="true"><line x1="0" x2="34" y1="5" y2="5" stroke="var(--pred)" stroke-width="4" stroke-dasharray="8 5"/></svg>${esc(pred())} (${T("dashed")})</span></div>`;
  q.legend = legend;

  if (type === "tapPreyPeak" || type === "tapPredFall") {
    q.kind = "tap";
    const peaks = peaksOf(m.prey).map((t) => [t - 1.2, t + 1.2]);
    const der = m.pred.map((p, i) => (i === 0 ? 0 : (p[1] - m.pred[i - 1][1]) / (p[0] - m.pred[i - 1][0])));
    const maxD = Math.max(...der.map(Math.abs));
    const falls = rangesWhere(m.pred, (i) => der[i] < -0.12 * maxD);
    const ranges = type === "tapPreyPeak" ? peaks : falls;
    const line = type === "tapPreyPeak" ? m.prey : m.pred;
    q.view = () => ({ prompt: T(type === "tapPreyPeak" ? "qTapPreyPeak" : "qTapPredFall", nm()), story: "", sub: type === "tapPreyPeak" ? T("subPeak") : "", subHint: true });
    q.check = (p) => ({
      ok: Math.abs(p.y - valAt(line, p.x)) <= 0.13 * m.yMax && ranges.some(([a, b]) => p.x >= a - 0.3 && p.x <= b + 0.3),
      hint: T(type === "tapPreyPeak" ? "hintPeak" : "hintFall", nm()),
    });
    q.graph = () => spec({ tap: true, shade: q.done ? ranges : null });
    q.explain = () => [esc(T(type === "tapPreyPeak" ? "ePeak" : "eFall", nm())), esc(T("shaded"))];
    return q;
  }
  const C = {
    whichPred: ["qWhichPred", null, "hintWhichPred", "ePred"],
    afterUp: ["qAfterUp", ["au0", "au1", "au2"], "hintAfterUp", "eAfterUp"],
    whyDown: ["qWhyDown", ["wd0", "wd1", "wd2"], "hintWhyDown", "eWhyDown"],
    unl: ["qUnl", null, "hintUnl", "eUnl"],
    order: ["qOrder", ["or0", "or1", "or2"], "hintOrder", "eOrder"],
    whyLag: ["qWhyLag", ["wg0", "wg1", "wg2"], "hintLag", "eLag"],
    remove: ["qRemove", ["rm0", "rm1", "rm2"], "hintRemove", "eRemove"],
  }[type];
  q.view = () => ({ prompt: T(C[0], nm()), story: "", sub: type === "unl" ? T("subUnl") : "", subHint: true });
  if (type === "whichPred") {
    q.correct = "pred"; q._order = shuffle(["pred", "prey"]);
    q.choices = () => q._order.map((id) => ({ id, label: id === "pred" ? pred() : prey(), desc: id === "pred" ? T("dashed") : T("solid") }));
  } else if (type === "unl") {
    q.correct = predIsA ? "A" : "B";
    q.choices = () => [{ id: "A", label: T("lineA") }, { id: "B", label: T("lineB") }];
  } else {
    q.correct = C[1][0]; q._order = shuffle(C[1]);
    q.choices = () => q._order.map((id) => ({ id, label: T(id, nm()) }));
  }
  q.check = choiceCheck(C[2], nm);
  q.explain = () => [esc(T(C[3], Object.assign(nm(), { style: T("dashed"), x: predIsA ? "A" : "B", y: predIsA ? "B" : "A" })))];
  return q;
}

// ---------- Limiting factors ----------
function genLF() {
  const lv = levelNum(), h = habitat();
  const pool = LF_CARDS.filter((c) => c.h === h);
  const q = { topic: "lf", h, kind: "choice" };
  if (lv < 3) {
    const cand = pool.filter((c) => (lv === 1 ? c.lvl === 1 : true));
    const card = pick(cand.length ? cand : pool);
    q.type = "sort"; q.card = card; q.correct = card.cat;
    q.view = () => ({ prompt: T("qLF"), story: "", sub: "", visual: lfCard(card) });
    q.choices = () => [{ id: "DD", label: T("DD"), desc: T("DDd") }, { id: "DI", label: T("DI"), desc: T("DId") }];
    q.check = choiceCheck("hintLF");
    q.explain = () => [esc(card[state.lang][2]), esc(T(card.cat === "DD" ? "eDD" : "eDI"))];
  } else {
    const target = Math.random() < 0.5 ? "DD" : "DI";
    // the right card can come from land or ocean (80/20); the two wrong ones are from any habitat
    const right = pick(pool.filter((c) => c.cat === target));
    const wrong = shuffle(LF_CARDS.filter((c) => c.cat !== target)).slice(0, 2);
    q.type = "pick"; q.target = target; q.correct = right.id; q.cards = shuffle([right, ...wrong]);
    q.view = () => ({ prompt: T(target === "DD" ? "qPickDD" : "qPickDI"), story: "", sub: "" });
    q.choices = () => q.cards.map((c) => ({ id: c.id, label: `${c.em} ${c[state.lang][0]}`, desc: c[state.lang][1] }));
    q.check = choiceCheck("hintLF");
    q.explain = () => [esc(`${right[state.lang][0]}: ${right[state.lang][2]}`), esc(T(target === "DD" ? "eDD" : "eDI"))];
  }
  return q;
}
function lfCard(card) {
  const c = card[state.lang];
  let s = `<div class="lf-card"><div class="emoji" aria-hidden="true">${card.em}</div><div><h3>${esc(c[0])}</h3><p>${esc(c[1])}</p></div></div>`;
  if (state.mode === "practice") s += `<div class="sub">${esc(T("lfAsk"))}</div><div class="lf-hint"><div>${esc(T("lfYes"))}</div><div>${esc(T("lfNo"))}</div></div>`;
  return s;
}

const GENERATORS = { bide: genBide, curves: genCurves, k: genK, pp: genPP, lf: genLF };

// ======================================================================
// RENDERING
// ======================================================================
function newQuestion() {
  stopSim();
  const q = GENERATORS[state.topic]();
  Object.assign(q, { tries: 0, done: false, solved: false, firstTry: null, picks: [], tap: null, feedback: null });
  state.q = q;
  render();
}

function renderStatic() {
  document.documentElement.lang = state.lang;
  document.title = T("title");
  $("t-title").textContent = T("title");
  $("t-tagline").textContent = T("tagline");
  $("t-mode").textContent = T("mode"); $("m-practice").textContent = T("practice"); $("m-test").textContent = T("test");
  $("t-level").textContent = T("level"); $("l-easy").textContent = T("easy"); $("l-medium").textContent = T("medium"); $("l-hard").textContent = T("hard");
  $("t-lang").textContent = T("lang");
  $("btn-read").textContent = "🔊 " + T("read");
  $("btn-key").textContent = T("key"); $("btn-calc").textContent = T("calc"); $("btn-new").textContent = T("newQ");
  $("t-calc").textContent = T("calc"); $("calc-use").textContent = T("use"); $("t-usetip").textContent = T("useTip");
  // topics
  $("topics").innerHTML = TOPICS.map((t) => `<button type="button" class="topic" data-topic="${t}" aria-pressed="${state.topic === t}">${esc(L().topics[t][0])}<small>${esc(L().topics[t][1])}</small></button>`).join("");
  // segmented buttons
  document.querySelectorAll("#seg-mode button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.mode === state.mode));
  document.querySelectorAll("#seg-level button").forEach((b) => { b.setAttribute("aria-pressed", b.dataset.level === state.level); b.disabled = state.mode === "test" && b.dataset.level === "easy"; b.title = b.disabled ? T("easyOff") : ""; });
  document.querySelectorAll("#seg-lang button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.lang === state.lang));
  $("btn-key").setAttribute("aria-pressed", state.showKey); $("btn-calc").setAttribute("aria-pressed", state.showCalc);
  // vocabulary key
  $("key-panel").hidden = !state.showKey;
  $("key-panel").innerHTML = `<h2>${esc(T("keyTitle"))}</h2>` + (state.mode === "test"
    ? `<p class="muted">${esc(T("keyOff"))}</p>`
    : `<dl>${L().keyItems.map(([a, b]) => `<dt>${esc(a)}</dt><dd>${esc(b)}</dd>`).join("")}</dl>`);
  $("calc-panel").hidden = !state.showCalc;
  $("wrap").classList.toggle("noside", !state.showKey && !state.showCalc);
  // footer
  $("foot").innerHTML = `<p style="margin:0">${esc(T("foot"))}</p><details><summary>${esc(T("srcTitle"))}</summary><ul>${SOURCES.map(([t, u]) => `<li>${u ? `<a href="${u}" target="_blank" rel="noopener">${esc(t)}</a>` : esc(t)}</li>`).join("")}</ul></details>`;
  updateThemeBtn();
}

function render() {
  renderStatic();
  const main = $("main");
  let h = "";
  if (state.mode === "test") {
    h += `<div class="banner ${state.passed ? "win" : ""}">${esc(state.passed ? T("pass") : T("testIntro"))}${state.passed ? ` <button class="btn small" type="button" id="new-test">${esc(T("newTest"))}</button>` : ""}</div>`;
  }
  // Predator–prey: Questions / Simulation switch
  if (state.topic === "pp") {
    h += `<div class="seg" id="pp-view" role="group"><button type="button" data-v="questions" aria-pressed="${state.ppView === "questions"}">${esc(T("viewQ"))}</button><button type="button" data-v="sim" aria-pressed="${state.ppView === "sim"}" ${state.mode === "test" ? "disabled" : ""}>${esc(T("viewSim"))}</button></div>`;
    if (state.ppView === "sim" && state.mode === "practice") { main.innerHTML = h + simHTML(); bindCommon(); startSimView(); return; }
  }
  // Human population: Lab / Questions switch (the lab is practice only)
  if (state.topic === "human") {
    h += `<div class="seg" id="hum-view" role="group"><button type="button" data-v="lab" aria-pressed="${state.humView === "lab"}" ${state.mode === "test" ? "disabled" : ""}>${esc(T("viewLab"))}</button><button type="button" data-v="questions" aria-pressed="${state.humView === "questions"}">${esc(T("viewQ"))}</button></div>`;
    if (state.humView === "lab" && state.mode === "practice") { if (!state.lab) state.lab = newLab(); main.innerHTML = h + labHTML(); bindCommon(); bindLab(); return; }
  }
  main.innerHTML = h + cardHTML(state.q);
  bindCommon();
  bindCard();
}

function cardHTML(q) {
  const v = q.view();
  const showSub = v.sub && !(state.mode === "test" && v.subHint);
  let h = `<article class="card${q.solved ? " solved" : ""}" id="qcard">`;
  h += `<div class="qtag"><span>${esc(L().topics[q.topic][0])}</span><span>${esc(T(state.level))}</span></div>`;
  h += `<h2 class="prompt" id="q-prompt">${esc(v.prompt)}</h2>`;
  if (v.story) h += `<p class="story" id="q-story">${esc(v.story)}</p>`;
  if (showSub) h += `<p class="sub" id="q-sub">${esc(v.sub)}</p>`;
  if (v.visual) h += v.visual;
  if (q.graph) {
    const spec = q.graph();
    h += `<div class="graph-wrap${spec.tap && !q.done ? " tappable" : ""}" id="graph-wrap">${drawGraph(spec, q)}`;
    if (q.legend) h += q.legend();
    h += `<p class="graph-note">${esc(spec.note || T("modelNote"))}</p></div>`;
  }
  // answer area
  if (q.kind === "num") {
    h += `<div class="answer-row"><label for="ans">${esc(T("answer"))}</label><input id="ans" class="numin" type="text" inputmode="decimal" autocomplete="off" ${q.done ? "disabled" : ""} value="${q.lastVal !== undefined ? esc(q.lastVal) : ""}"><button class="btn" type="button" id="btn-check" ${q.done ? "disabled" : ""}>${esc(T("check"))}</button></div>`;
  } else if (q.kind === "tap") {
    if (!q.done) h += `<p class="sub">${esc(T("tapHint"))}</p>`;
    h += `<div class="answer-row"><button class="btn" type="button" id="btn-check" ${q.done ? "disabled" : ""}>${esc(T("check"))}</button></div>`;
  } else {
    h += `<div class="choices" role="group">` + q.choices().map((c) => {
      let cls = "choice";
      if (q.picks.includes(c.id)) cls += " wrong";
      if (q.done && c.id === q.correct) cls += " right";
      return `<button type="button" class="${cls}" data-c="${esc(c.id)}" ${q.done ? "disabled" : ""}><b>${esc(c.label)}</b>${c.desc ? `<small>${esc(c.desc)}</small>` : ""}</button>`;
    }).join("") + `</div>`;
  }
  // feedback + explanation
  if (q.feedback) {
    const f = q.feedback;
    let text = T(f.key);
    if (f.hint) text += " " + f.hint;
    h += `<div class="feedback ${f.cls}" role="status">${esc(text)}</div>`;
    if (q.done && !q.solved && q.kind === "num") h += `<div class="feedback info">${esc(T("answerIs"))} <span class="num">${fmt(q.correct)}</span></div>`;
    if (q.done && !q.solved && state.mode === "test") h += `<div class="feedback info">${esc(T("testMiss"))}</div>`;
  }
  if (q.done) h += `<div class="expl"><h3>${esc(q.solved ? T("whyTitle") : T("explTitle"))}</h3><ol>${q.explain().map((l) => `<li>${l}</li>`).join("")}</ol></div>`;
  if (q.done) h += `<div class="next-row"><button class="btn" type="button" id="btn-next">${esc(T("next"))}</button></div>`;
  return h + `</article>`;
}

  if (q.kind === "num") {
    if (value === null) { setFeedback(q, "bad", "needNum"); return render(); }
  }
  if (q.kind === "tap" && !q.tap) { setFeedback(q, "bad", "needTap"); return render(); }
  q.tries++;
  const res = q.check(q.kind === "tap" ? q.tap : value);
  if (res.ok) {
    q.done = q.solved = true;
    if (q.firstTry === null) q.firstTry = true;
    let big = false;
    if (state.mode === "test" && q.firstTry && !state.passed) { state.passed = true; big = true; }
    setFeedback(q, "good", "correct");
    render();
    confetti(big);
    focusNext();
    return;
  }
  if (q.firstTry === null) q.firstTry = false;
  if (q.kind === "choice") q.picks.push(value);
  if (state.mode === "test" || q.tries >= 2) {
    q.done = true;
    setFeedback(q, "bad", "wrongShown");

function simReset() { sim.t = 0; sim.x = sim.prey0; sim.y = sim.pred0; sim.hist = [[0, sim.x, sim.y]]; sim.caption = "capStart"; syncDots(true); }

const reduceMotion = () => window.matchMedia("(prefers-reduced-motion: reduce)").matches;
// Keep the number of dots in the field matched to the population (1 dot ≈ 5 prey, 1 triangle ≈ 2 predators)
function syncDots(reset) {
  const want = { prey: Math.min(200, Math.round(sim.x / 5)), pred: Math.min(80, Math.round(sim.y / 2)) };
  for (const k of ["prey", "pred"]) {
    if (reset) sim.dots[k] = [];
    const arr = sim.dots[k];
    while (arr.length < want[k]) arr.push({ x: Math.random(), y: Math.random(), a: Math.random() * 6.28 });
    while (arr.length > want[k]) arr.splice(Math.floor(Math.random() * arr.length), 1);

      d.a += (Math.random() - 0.5) * 0.6; const sp = k === "pred" ? 0.004 : 0.0025;
      d.x += Math.cos(d.a) * sp; d.y += Math.sin(d.a) * sp;
      if (d.x < 0.02 || d.x > 0.98) { d.a = Math.PI - d.a; d.x = Math.min(0.98, Math.max(0.02, d.x)); }
      if (d.y < 0.04 || d.y > 0.96) { d.a = -d.a; d.y = Math.min(0.96, Math.max(0.04, d.y)); }

function cssVar(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }

  ctx.fillStyle = cPred; sim.dots.pred.forEach((d) => { const x = d.x * W, y = d.y * H; ctx.beginPath(); ctx.moveTo(x, y - 7); ctx.lineTo(x + 6.5, y + 5); ctx.lineTo(x - 6.5, y + 5); ctx.closePath(); ctx.fill(); });

  [ctx, W, H] = fitCanvas(g);

  const t1 = Math.max(40, sim.t), t0 = t1 - 40;

// CALCULATOR (safe: no eval)
// ======================================================================
let calcExpr = "";
const CALC_KEYS = ["7", "8", "9", "÷", "4", "5", "6", "×", "1", "2", "3", "−", "0", ".", "⌫", "+", "C", "(", ")", "="];
function calcEval(str) {
  const toks = str.replace(/×/g, "*").replace(/÷/g, "/").replace(/−/g, "-").match(/\d*\.?\d+|[-+*/()]/g) || [];
  let i = 0;
  const peek = () => toks[i], next = () => toks[i++];
  function expr() { let v = term(); while (peek() === "+" || peek() === "-") { const op = next(); const r = term(); v = op === "+" ? v + r : v - r; } return v; }
  function term() { let v = factor(); while (peek() === "*" || peek() === "/") { const op = next(); const r = factor(); v = op === "*" ? v * r : v / r; } return v; }
  function factor() { const t = next(); if (t === "-") return -factor(); if (t === "(") { const v = expr(); if (next() !== ")") throw 0; return v; } const v = parseFloat(t); if (isNaN(v)) throw 0; return v; }
  const v = expr(); if (i !== toks.length || !Number.isFinite(v)) throw 0;
  return Math.round(v * 1e6) / 1e6;
}
function calcPress(k) {
  if (k === "C") calcExpr = "";
  else if (k === "⌫") calcExpr = calcExpr.slice(0, -1);
  else if (k === "=") { try { calcExpr = String(calcEval(calcExpr)).replace("-", "−"); } catch (e) { calcExpr = "Error"; } }
  else { if (calcExpr === "Error") calcExpr = ""; calcExpr += k; }
  $("calc-screen").textContent = calcExpr || "0";
}

function confetti(big) {
  if (reduceMotion()) return;
  const cv = $("confetti"); cv.hidden = false;
  const ctx = cv.getContext("2d"); cv.width = innerWidth; cv.height = innerHeight;
  const colors = [cssVar("--accent"), cssVar("--cover"), cssVar("--prey"), cssVar("--pred")];
  const n = big ? 160 : 40;
  const parts = Array.from({ length: n }, () => ({ x: innerWidth / 2 + (Math.random() - 0.5) * 200, y: innerHeight * (big ? 0.35 : 0.5), vx: (Math.random() - 0.5) * (big ? 16 : 9), vy: -Math.random() * (big ? 16 : 10) - 3, s: 5 + Math.random() * 6, c: pick(colors), r: Math.random() * 6 }));
  let frames = 0;
  (function step() {
    ctx.clearRect(0, 0, cv.width, cv.height);
    parts.forEach((p) => { p.vy += 0.4; p.x += p.vx; p.y += p.vy; p.r += 0.2; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); ctx.restore(); });
    if (++frames < (big ? 150 : 80)) requestAnimationFrame(step); else { ctx.clearRect(0, 0, cv.width, cv.height); cv.hidden = true; }
  })();
}

function humanSpec(extra) {
  return Object.assign({ xMin: 1600, xMax: 2050, xStep: 50, yMax: 10, xLabel: T("year"), yLabel: T("yBillions"), note: T("dataNote"),
    series: [{ pts: HUMAN_DATA, color: "--accent", dots: true, width: 3 }] }, extra || {});

const bil = (n) => fmt(n);   // numbers like 0.5 show as 0,5 in Vietnamese

// QUESTIONS VIEW (random, uses levels; also used for Test mode)

function genHuman() {
  const lv = levelNum();
  const type = pick(lv === 1 ? ["readPop", "whenReach", "hShape"] : lv === 2 ? ["dblNum", "tapReach", "factor"] : ["fastest", "slowing", "whySlow", "dblNum"]);
  const q = { topic: "human", type, kind: "choice" };
  q.graph = () => humanSpec();
  if (type === "readPop") {
    const row = pick(HUMAN_DATA.slice(1, 10));
    const others = shuffle(HUMAN_DATA.filter((d) => d[1] !== row[1])).slice(0, 3).map((d) => d[1]);
    q.correct = String(row[1]); q._order = shuffle([row[1], ...others].map(String));
    q.view = () => ({ prompt: T("qReadPop", { y: row[0] }), story: "", sub: "" });
    q.choices = () => q._order.map((id) => ({ id, label: T("billionsU", { n: bil(Number(id)) }) }));
    q.check = choiceCheck("hintRead");
    q.explain = () => [esc(T("eRead", { y: row[0], n: bil(row[1]) }))];
  } else if (type === "whenReach" || type === "tapReach") {
    const row = pick(HUMAN_DATA.filter((d) => Number.isInteger(d[1]) && d[1] >= 1));
    const [y, n] = row;
    if (type === "whenReach") {
      const others = shuffle(HUMAN_DATA.filter((d) => d[0] !== y)).slice(0, 3).map((d) => d[0]);
      q.correct = String(y); q._order = shuffle([y, ...others].map(String));
      q.view = () => ({ prompt: T("qWhenReach", { n }), story: "", sub: "" });
      q.choices = () => q._order.map((id) => ({ id, label: id }));
      q.check = choiceCheck("hintWhenReach", () => ({ n }));
    } else {
      q.kind = "tap";
      q.view = () => ({ prompt: T("qTapReach", { n }), story: "", sub: "" });
      q.check = (p) => ({ ok: Math.abs(p.x - y) <= 9 && Math.abs(p.y - n) <= 0.7, hint: T("hintTapReach", { n }) });
      q.graph = () => humanSpec({ tap: true, shade: q.done ? [[y - 9, y + 9]] : null });
    }
    q.explain = () => [esc(T("eReach", { n, y }))];
  } else if (type === "hShape") {
    q.correct = "shJ"; q._order = shuffle(["shJ", "shS", "shL"]);
    q.view = () => ({ prompt: T("qHShape"), story: "", sub: "" });
    q.choices = () => q._order.map((id) => ({ id, label: T(id) }));
    q.check = choiceCheck("hintShape");
    q.explain = () => [esc(T("shapeExpl"))];
  } else if (type === "dblNum") {
    const [a, b, y1, y2] = pick(DOUBLINGS);
    q.kind = "num"; q.correct = y2 - y1;
    q.view = () => ({ prompt: T("qDblNum", { a: bil(a), b: bil(b) }), story: "", sub: "" });
    q.check = (v) => ({ ok: Math.abs(v - q.correct) <= 1, hint: T("dblHint", { a: bil(a), b: bil(b) }) });
    q.graph = () => humanSpec({ shade: q.done ? [[y1, y2]] : null });
    q.explain = () => [esc(T("dblExpl", { a: bil(a), b: bil(b), y1, y2, d: y2 - y1 }))];
  } else if (type === "factor") {
    const f = pick(FACTORS);
    q.correct = f.dir; q.graph = null;
    q.view = () => ({ prompt: T("qFactor"), story: "", sub: "", visual: `<div class="lf-card"><div class="emoji" aria-hidden="true">${f.em}</div><div><p>${esc(T(f.id + "t"))}</p></div></div>` });
    q.choices = () => [{ id: "up", label: T("fUp") }, { id: "down", label: T("fDown") }];
    q.check = choiceCheck("hintFactor");
    q.explain = () => [esc(T(f.id + "w"))];
  } else if (type === "fastest") {
    q.correct = "2"; q._order = shuffle(["0", "1", "2", "3"]);
    q.view = () => ({ prompt: T("qFastest"), story: "", sub: "" });
    q.choices = () => q._order.map((id) => { const d = DOUBLINGS[+id]; return { id, label: T("dblLabel", { a: bil(d[0]), b: bil(d[1]) }) }; });
    q.check = choiceCheck("hintFastest");
    q.graph = () => humanSpec({ shade: q.done ? [[1927, 1974]] : null });
    q.explain = () => [...DOUBLINGS.map(([a, b, y1, y2]) => esc(T("eDblLine", { a: bil(a), b: bil(b), y1, y2, d: y2 - y1 }))), esc(T("eFastest", { a: 2, b: 4 }))];
  } else {
    const map = { slowing: ["qSlowing", ["sl0", "sl1", "sl2"], "hintSlowing", "eSlowing"], whySlow: ["qWhySlow", ["ws0", "ws1", "ws2"], "hintWhySlow", "eWhySlow"] }[type];
    q.correct = map[1][0]; q._order = shuffle(map[1]);
    q.view = () => ({ prompt: T(map[0]), story: "", sub: "" });
    q.choices = () => q._order.map((id) => ({ id, label: T(id) }));
    q.check = choiceCheck(map[2]);
    q.explain = () => [esc(T(map[3]))];
  }
  return q;
}
GENERATORS.human = genHuman;

function newLab() {
  const order = {};
  for (const k of Object.keys(LAB_MC)) order[k] = shuffle(LAB_MC[k].opts);
  return { entries: {}, bad: {}, items: {}, order, hl: null, pred: null, celebrated: false, wasDone: false };
}
const labItem = (id) => (state.lab.items[id] = state.lab.items[id] || { tries: 0, done: false, ok: false, picks: [], val: "", hint: "" });
const entryOk = (y) => { const d = HUMAN_DATA.find((r) => r[0] === y); const v = parseNum(state.lab.entries[y] || ""); return v !== null && Math.abs(v - d[1]) < 1e-9; };
const graphDone = () => HUMAN_DATA.every(([y]) => entryOk(y));
function labDoneAll() {
  const it = state.lab.items;
  const ids = ["d0", "d1", "d2", "d3", "pat", "shape", "when", ...FACTORS.map((f) => f.id), "fut"];
  return state.lab.pred !== null && ids.every((id) => it[id] && it[id].done);
}

function labSpec() {
  const lab = state.lab;
  const pts = HUMAN_DATA.filter(([y]) => entryOk(y));
  const series = [{ pts, color: "--accent", dots: true, width: 3 }];
  if (lab.pred !== null) series.push({ pts: HUMAN_PROJ, color: "--cover", dash: "8 6", dots: true, width: 3, label: T("projLabel") });
  return { xMin: 1600, xMax: 2100, xStep: 50, yMax: 11, xLabel: T("year"), yLabel: T("yBillions"), series, shade: lab.hl ? [lab.hl] : null,
    aria: T("labTitle") };
}
function labGraphHTML() { return drawGraph(labSpec(), {}) + `<p class="graph-note">${esc(T("dataNote"))}</p>`; }

// Feedback + explanation block under one lab item
function itemFeedback(it, explain) {
  let h = "";
  if (it.done) h += `<div class="feedback ${it.ok ? "good" : "bad"}">${esc(it.ok ? T("correct") : T("wrongShown"))}</div><p class="sub">${explain}</p>`;
  else if (it.hint) h += `<div class="feedback bad">${esc(T("wrongTry") + " " + it.hint)}</div>`;
  return h;
}
function mcItemHTML(id) {
  const m = LAB_MC[id], it = labItem(id);
  const btns = state.lab.order[id].map((c) => {
    let cls = "choice"; if (it.picks.includes(c)) cls += " wrong"; if (it.done && c === m.opts[0]) cls += " right";
    return `<button type="button" class="${cls}" data-item="${id}" data-c="${c}" ${it.done ? "disabled" : ""}><b>${esc(T(c))}</b></button>`;
  }).join("");
  return `<div class="lab-item"><p class="lab-q">${esc(T(m.q))}</p><div class="choices">${btns}</div>${itemFeedback(it, esc(T(m.expl)))}</div>`;
}

function labHTML() {
  const lab = state.lab, done = graphDone();
  let h = `<article class="card" id="labcard">
    <div class="qtag"><span>${esc(L().topics.human[0])}</span><span>${esc(T("viewLab"))}</span></div>
    <h2 class="prompt">${esc(T("labTitle"))}</h2><p class="sub">${esc(T("labGoal"))}</p>`;
  // Step 1: build the graph
  const rows = HUMAN_DATA.map(([y, v]) => {
    const ok = entryOk(y), bad = !ok && lab.bad[y];
    return `<tr id="row-${y}" class="${ok ? "ok" : bad ? "bad" : ""}"><th scope="row">${y}</th><td class="num">${bil(v)}</td>
      <td><input class="numin entry" id="e-${y}" data-year="${y}" type="text" inputmode="decimal" autocomplete="off" aria-label="${y}: ${esc(T("colData"))}" value="${esc(lab.entries[y] || "")}"></td>
      <td class="mark" aria-live="polite" title="${bad ? esc(T("entryWrong")) : ""}">${ok ? "✓" : bad ? "✗" : ""}</td></tr>`;
  }).join("");
  const n = HUMAN_DATA.filter(([y]) => entryOk(y)).length;
  h += `<section class="lab-step"><h3>${esc(T("step1"))}</h3><p class="sub">${esc(T("step1Tip"))}</p>
    <div class="lab-grid"><div class="tbl-wrap"><table class="data lab-table"><thead><tr><th>${esc(T("colYear"))}</th><th>${esc(T("colData"))}</th><th>${esc(T("colEntry"))}</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>
    <div class="graph-wrap" id="lab-graph">${labGraphHTML()}</div></div>
    <p class="lab-status" id="lab-status">${esc(done ? T("step1Done") : T("plotted", { n, t: HUMAN_DATA.length }))}</p>
    <div class="next-row">${done ? "" : `<button class="btn ghost small" type="button" id="lab-fill">${esc(T("fillRest"))}</button>`}<button class="btn ghost small" type="button" id="lab-reset">${esc(T("startOver"))}</button></div></section>`;
  if (!done) return h + `<div class="feedback info">${esc(T("lockMsg"))}</div></article>`;

  // Step 2: doubling times
  h += `<section class="lab-step"><h3>${esc(T("step2"))}</h3><p class="sub">${esc(T("step2Intro"))}</p>`;
  DOUBLINGS.forEach(([a, b, y1, y2], i) => {
    const id = "d" + i, it = labItem(id);
    h += `<div class="lab-item"><label class="lab-q" for="i-${id}">${esc(T("dblQ", { a: bil(a), b: bil(b) }))}</label>
      <div class="answer-row"><input class="numin" id="i-${id}" data-num="${id}" type="text" inputmode="numeric" autocomplete="off" value="${esc(it.val)}" ${it.done ? "disabled" : ""}><span>${esc(T("years"))}</span>
      <button class="btn small" type="button" data-check="${id}" ${it.done ? "disabled" : ""}>${esc(T("check"))}</button></div>
      ${itemFeedback(it, esc(T("dblExpl", { a: bil(a), b: bil(b), y1, y2, d: y2 - y1 })))}</div>`;
  });
  h += mcItemHTML("pat") + `</section>`;
  // Step 3: shape
  h += `<section class="lab-step"><h3>${esc(T("step3"))}</h3>${mcItemHTML("shape")}${mcItemHTML("when")}</section>`;
  // Step 4: factors
  h += `<section class="lab-step"><h3>${esc(T("step4"))}</h3><p class="sub">${esc(T("step4Intro"))}</p>`;
  FACTORS.forEach((f) => {
    const it = labItem(f.id);
    const btn = (dir) => { let cls = "choice"; if (it.picks.includes(dir)) cls += " wrong"; if (it.done && dir === f.dir) cls += " right"; return `<button type="button" class="${cls}" data-item="${f.id}" data-c="${dir}" ${it.done ? "disabled" : ""}><b>${esc(T(dir === "up" ? "fUp" : "fDown"))}</b></button>`; };
    h += `<div class="lab-item factor"><p class="lab-q"><span aria-hidden="true">${f.em}</span> ${esc(T(f.id + "t"))}</p><div class="choices two">${btn("up")}${btn("down")}</div>${itemFeedback(it, esc(T(f.id + "w")))}</div>`;
  });
  h += `</section>`;
  // Step 5: predict
  const pi = labItem("pred");
  h += `<section class="lab-step"><h3>${esc(T("step5"))}</h3><div class="lab-item"><label class="lab-q" for="i-pred">${esc(T("predQ"))}</label>
    ${lab.pred === null ? `<p class="sub">${esc(T("predHint"))}</p>` : ""}
    <div class="answer-row"><input class="numin" id="i-pred" data-num="pred" type="text" inputmode="decimal" autocomplete="off" value="${esc(pi.val)}" ${lab.pred !== null ? "disabled" : ""}><span>${esc(T("billionsU", { n: "" }).trim())}</span>
    <button class="btn small" type="button" data-check="pred" ${lab.pred !== null ? "disabled" : ""}>${esc(T("check"))}</button></div>`;
  if (pi.hint) h += `<div class="feedback bad">${esc(pi.hint)}</div>`;
  if (lab.pred !== null) {
    const p = lab.pred, cmp = Math.abs(p - 9.7) <= 1 ? "predClose" : p > 9.7 ? "predHigh" : "predLow";
    h += `<div class="feedback info">${esc(T("predYou", { p: bil(p) }))} ${esc(T(cmp))}</div><p class="sub">${esc(T("predUN"))}</p></div>${mcItemHTML("fut")}`;
  } else h += `</div>`;
  h += `</section>`;
  if (labDoneAll()) h += `<div class="banner win">${esc(T("labDone"))}</div>`;
  return h + `</article>`;
}

function renderLab() {
  const y = window.scrollY;
  $("labcard").outerHTML = labHTML();
  window.scrollTo(0, y);
  bindLab();
}

function bindLab() {
  const card = $("labcard"); if (!card) return;
  const lab = state.lab;
  // Step 1 typing: update the row, graph, and count without rebuilding the page (keeps the cursor in place)
  card.querySelectorAll("input.entry").forEach((inp) => {
    const y = +inp.dataset.year;
    const refresh = () => {
      const ok = entryOk(y), row = $("row-" + y);
      row.className = ok ? "ok" : lab.bad[y] ? "bad" : "";
      const mark = row.querySelector(".mark"); mark.textContent = ok ? "✓" : lab.bad[y] ? "✗" : ""; mark.title = lab.bad[y] && !ok ? T("entryWrong") : "";
      $("lab-graph").innerHTML = labGraphHTML();
      const n = HUMAN_DATA.filter(([yy]) => entryOk(yy)).length;
      const badYears = HUMAN_DATA.filter(([yy]) => lab.bad[yy] && !entryOk(yy)).map(([yy]) => yy);
      $("lab-status").textContent = graphDone() ? T("step1Done") : T("plotted", { n, t: HUMAN_DATA.length }) + (badYears.length ? " " + T("checkYears", { y: badYears.join(", ") }) : "");
    };
    inp.addEventListener("focus", () => { state.lastInputId = inp.id; });
    inp.addEventListener("input", () => { lab.entries[y] = inp.value; if (entryOk(y)) lab.bad[y] = false; refresh(); if (graphDone()) { renderLab(); confetti(false); } });
    inp.addEventListener("change", () => { lab.bad[y] = inp.value.trim() !== "" && !entryOk(y); refresh(); });
    inp.addEventListener("keydown", (e) => {
      if (e.key !== "Enter") return;
      lab.bad[y] = inp.value.trim() !== "" && !entryOk(y); refresh();
      const next = inp.closest("tr").nextElementSibling; if (next) next.querySelector("input").focus();
    });
  });
  const fill = $("lab-fill"); if (fill) fill.addEventListener("click", () => { HUMAN_DATA.forEach(([y, v]) => { if (!entryOk(y)) lab.entries[y] = String(v); }); renderLab(); });
  $("lab-reset").addEventListener("click", () => { state.lab = newLab(); renderLab(); });
  card.querySelectorAll("input[data-num]").forEach((inp) => {
    inp.addEventListener("focus", () => { state.lastInputId = inp.id; });
    inp.addEventListener("input", () => { labItem(inp.dataset.num).val = inp.value; });
    inp.addEventListener("keydown", (e) => { if (e.key === "Enter") labCheck(inp.dataset.num); });
  });
  card.querySelectorAll("[data-check]").forEach((b) => b.addEventListener("click", () => labCheck(b.dataset.check)));
  card.querySelectorAll(".choice[data-item]").forEach((b) => b.addEventListener("click", () => labPick(b.dataset.item, b.dataset.c)));
}

// Practice rule: 1st miss = hint and try again, 2nd miss = show the answer
function labResult(it, ok, hint) {
  it.tries++;
  if (ok) { it.done = it.ok = true; it.hint = ""; }
  else if (it.tries >= 2) { it.done = true; it.hint = ""; }
  else it.hint = hint;
}
function labCheck(id) {
  const lab = state.lab, it = labItem(id);
  const v = parseNum(it.val);
  if (id === "pred") {
    if (v === null || v < 8 || v > 30) { it.hint = T("predNeed"); return renderLab(); }
    it.hint = ""; lab.pred = v; return labAfter();
  }
  if (v === null) { it.hint = T("needNum"); return renderLab(); }
  const [a, b, y1, y2] = DOUBLINGS[+id.slice(1)];
  labResult(it, Math.abs(v - (y2 - y1)) <= 1, T("dblHint", { a: bil(a), b: bil(b) }));
  if (it.done) lab.hl = [y1, y2];   // highlight the two years on the graph
  labAfter(it);
}
function labPick(id, c) {
  const it = labItem(id);
  if (it.done) return;
  const f = FACTORS.find((x) => x.id === id);
  const correct = f ? f.dir : LAB_MC[id].opts[0];
  const hint = f ? T("hintFactor") : T(LAB_MC[id].hint);
  if (c !== correct) it.picks.push(c);
  labResult(it, c === correct, hint);
  labAfter(it);
}
function labAfter(it) {
  renderLab();
  if (it && it.done && it.ok) confetti(false);
  if (labDoneAll() && !state.lab.celebrated) { state.lab.celebrated = true; confetti(true); }
}
// Read-aloud text for the lab: the goal plus the first thing the student still needs to do
function labReadText() {
  if (!graphDone()) return [T("labTitle"), T("labGoal"), T("step1"), T("step1Tip")].join(". ");
  const it = state.lab.items;
  for (let i = 0; i < 4; i++) if (!(it["d" + i] && it["d" + i].done)) { const [a, b] = DOUBLINGS[i]; return T("step2Intro") + " " + T("dblQ", { a: bil(a), b: bil(b) }); }
  for (const id of ["pat", "shape", "when"]) if (!(it[id] && it[id].done)) return T(LAB_MC[id].q) + ". " + state.lab.order[id].map((c) => T(c)).join(". ");
  for (const f of FACTORS) if (!(it[f.id] && it[f.id].done)) return T("step4Intro") + " " + T(f.id + "t") + ". " + T("fUp") + ". " + T("fDown");
  if (state.lab.pred === null) return T("predQ") + " " + T("predHint");
  if (!(it.fut && it.fut.done)) return T("predUN") + " " + T("futQ") + ". " + state.lab.order.fut.map((c) => T(c)).join(". ");
  return T("labDone");
}

init();
</script>
